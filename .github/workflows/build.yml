name: Build Project Infinity-X gold

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Up Disk Space & Add Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y
          sudo apt-get clean

          # Hapus swapfile lama jika ada, lalu buat baru
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo rclone

      - name: Setup Repo & Sync Source
        run: |
          mkdir -p ~/rom && cd ~/rom
          git config --global user.name "Danish Asnal Lu'Aizumar"
          git config --global user.email "email_kamu@gmail.com"

          # 1. Sync Source Code Project Infinity-X
          repo init -u https://github.com/ProjectInfinity-X/manifest.git -b QPR3 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

          # 2. Clone Device Trees
          git clone https://github.com/silly-moon/device_xiaomi_gold.git -b Luna device/xiaomi/gold
          git clone https://github.com/Dhterech/android_kernel_xiaomi_gold.git kernel/xiaomi/gold
          git clone https://github.com/Dhterech/android_vendor_xiaomi_gold.git vendor/xiaomi/gold
          git clone https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git -b lineage-22.1 device/mediatek/sepolicy_vndr
          git clone https://github.com/techyminati/android_vendor_mediatek_ims.git vendor/mediatek/ims
          git clone https://github.com/LineageOS/android_hardware_mediatek.git -b lineage-22.1 hardware/mediatek
          git clone https://github.com/LineageOS/android_hardware_xiaomi.git -b lineage-22.1 hardware/xiaomi

          # 3. Setup Private Keys (Infinity Keys Template)
          git clone https://github.com/ProjectInfinity-X/vendor_infinity_priv_keys-template.git -b QPR3 vendor/infinity-priv/keys
          cd vendor/infinity-priv/keys
          ./keys.sh
          cd ~/rom

      - name: Build ROM
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch infinity_gold-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-X-gold
          path: out/target/product/gold/Infinity*.zip
          retention-days: 30
