name: Build Project Infinity-X gold

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Up Disk Space & Add Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y
          sudo apt-get clean

          # Hapus swapfile lama jika ada, lalu buat baru
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo rclone

      - name: Setup Repo & Sync Source
        run: |
          set -ex
          mkdir -p ~/rom && cd ~/rom
          git config --global user.name "Danish Asnal Lu'Aizumar"
          git config --global user.email "email_kamu@gmail.com"

          # Network diagnostics
          echo "=== Network Diagnostics ==="
          ping -c 3 github.com || echo "Warning: Cannot ping github.com"
          curl -s -o /dev/null -w "%{http_code}" https://github.com/ProjectInfinity-X/manifest || echo "Warning: Cannot reach manifest repo"

          # 1. Sync Source Code Project Infinity-X with retry and timeout
          echo "=== Initializing Repo ==="
          repo init -u https://github.com/ProjectInfinity-X/manifest.git -b QPR3 --depth=1 --no-repo-verify

          echo "=== Starting Sync (with timeout and retries) ==="
          # Use timeout command to prevent hanging
          MAX_SYNC_TIME=1200  # 20 minutes max for sync
          ATTEMPTS=3

          for ((i=1; i<=ATTEMPTS; i++)); do
            echo "Sync attempt $i of $ATTEMPTS"
            if timeout $MAX_SYNC_TIME repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags --disable-repo-verification --optimized-fetch --prune; then
              echo "Sync successful on attempt $i"
              break
            else
              echo "Sync attempt $i failed or timed out"
              if [ $i -lt $ATTEMPTS ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
                # Clean up partial sync before retry
                rm -rf .repo/project-objects/
              fi
            fi
          done

          # Verify sync completed
          if [ ! -d ".repo/manifests" ]; then
            echo "ERROR: Repo initialization failed - .repo/manifests not found"
            exit 1
          fi

          echo "=== Sync completed, checking status ==="
          repo status || echo "Repo status check completed (some warnings may be normal)"

          # 2. Clone Device Trees
          echo "=== Cloning Device Trees ==="
          git clone https://github.com/silly-moon/device_xiaomi_gold.git -b Luna device/xiaomi/gold || { echo "Failed to clone device tree"; exit 1; }
          git clone https://github.com/Dhterech/android_kernel_xiaomi_gold.git kernel/xiaomi/gold || { echo "Failed to clone kernel"; exit 1; }
          git clone https://github.com/Dhterech/android_vendor_xiaomi_gold.git vendor/xiaomi/gold || { echo "Failed to clone vendor"; exit 1; }
          git clone https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git -b lineage-22.1 device/mediatek/sepolicy_vndr || { echo "Failed to clone sepolicy"; exit 1; }
          git clone https://github.com/techyminati/android_vendor_mediatek_ims.git vendor/mediatek/ims || { echo "Failed to clone ims"; exit 1; }
          git clone https://github.com/LineageOS/android_hardware_mediatek.git -b lineage-22.1 hardware/mediatek || { echo "Failed to clone mediatek hardware"; exit 1; }
          git clone https://github.com/LineageOS/android_hardware_xiaomi.git -b lineage-22.1 hardware/xiaomi || { echo "Failed to clone xiaomi hardware"; exit 1; }

          # 3. Setup Private Keys (Infinity Keys Template)
          echo "=== Setting up Private Keys ==="
          git clone https://github.com/ProjectInfinity-X/vendor_infinity_priv_keys-template.git -b QPR3 vendor/infinity-priv/keys || { echo "Failed to clone priv keys"; exit 1; }
          cd vendor/infinity-priv/keys
          chmod +x keys.sh
          ./keys.sh || { echo "Failed to run keys.sh"; exit 1; }
          cd ~/rom

      - name: Build ROM
        run: |
          set -ex
          cd ~/rom
          source build/envsetup.sh
          lunch infinity_gold-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Infinity-X-gold
          path: out/target/product/gold/Infinity*.zip
          retention-days: 30
