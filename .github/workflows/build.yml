name: Build Project Infinity-X gold

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clean Up Disk Space & Add Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable firefox powershell
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo rclone

      - name: Setup Repo & Sync Source
        run: |
          mkdir -p ~/rom && cd ~/rom
          git config --global user.name "Danish Asnal Lu'Aizumar"
          git config --global user.email "email_kamu@gmail.com"
          
          # 1. Sync Source Code Project Infinity-X
          repo init -u https://github.com/ProjectInfinity-X/manifest -b QPR3 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

          # 2. Clone Device Trees
          git clone https://github.com/silly-moon/device_xiaomi_gold.git -b Luna device/xiaomi/gold
          git clone https://github.com/Dhterech/android_kernel_xiaomi_gold.git device/xiaomi/gold-kernel
          git clone https://github.com/Dhterech/android_vendor_xiaomi_gold.git vendor/xiaomi/gold
          git clone https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git -b lineage-22.1 device/mediatek/sepolicy_vndr
          git clone https://github.com/techyminati/android_vendor_mediatek_ims.git vendor/mediatek/ims
          git clone https://github.com/LineageOS/android_hardware_mediatek.git -b lineage-22.1 hardware/mediatek
          git clone https://github.com/LineageOS/android_hardware_xiaomi.git -b lineage-22.1 hardware/xiaomi

          # 3. Setup Private Keys (Infinity Keys Template)
          git clone https://github.com/ProjectInfinity-X/vendor_infinity_priv_keys-template.git -b QPR3 vendor/infinity-priv/keys
          cd vendor/infinity-priv/keys
          ./keys.sh
          cd ~/rom

      - name: Build ROM
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch infinity_gold-ap3a-userdebug
          mka bacon -j4

      - name: Upload Output
        run: |
          cd ~/rom
          ZIP_PATH=$(ls out/target/product/gold/Infinity*.zip 2>/dev/null | head -n 1)
          if [ -f "$ZIP_PATH" ]; then
            echo "File installer ditemukan: $ZIP_PATH"
            # Tempatkan perintah upload rclone atau artifact provider di sini
          else
            echo "Build gagal: File ZIP tidak ditemukan."
            exit 1
          fi
          
